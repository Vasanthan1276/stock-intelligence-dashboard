name: Test Prediction Market Intelligence

on:
  pull_request:
    paths:
      - "prediction_market*.py"
      - "tests/test_prediction_market*.py"
      - "dashboard.py"
      - "dashboard_design.py"
      - "tests/test_dashboard_design.py"
      - "docs/assets/**"
      - "scanner.py"
      - "watchlist.json"
      - "portfolio-universe.json"
      - "docs/data/score-history.json"
      - "docs/data/mu-signal.json"
      - ".github/workflows/*"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test normalization, failure states and integration isolation
        run: python -m unittest discover -s tests -p 'test_prediction_market*.py' -v
      - name: Test dashboard design and old-layout preservation
        run: python -m unittest discover -s tests -p 'test_dashboard_design.py' -v
