name: Update Stock Intelligence Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "30 22 * * 0-5"

permissions:
  contents: write

jobs:

  update-dashboard:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Micron deep-dive report and Wealth Hub signal
        run: |
          python main.py

      - name: Validate Wealth Hub MU signal
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("docs/data/mu-signal.json")

          if not path.is_file():
              raise SystemExit(
                  "MU validation failed: docs/data/mu-signal.json is missing."
              )

          try:
              payload = json.loads(
                  path.read_text(encoding="utf-8"),
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"Invalid JSON numeric constant: {value}")
                  ),
              )
          except Exception as error:
              raise SystemExit(
                  f"MU validation failed: signal JSON is invalid: {error}"
              ) from error

          if payload.get("symbol") != "MU":
              raise SystemExit(
                  "MU validation failed: symbol is not MU."
              )

          price = payload.get("price_usd")

          if (
              isinstance(price, bool)
              or not isinstance(price, (int, float))
              or not math.isfinite(float(price))
              or float(price) <= 0
          ):
              raise SystemExit(
                  f"MU validation failed: invalid price_usd {price!r}."
              )

          scores = payload.get("scores") or {}

          for key in (
              "overall",
              "technical",
              "momentum",
              "fundamental",
              "valuation",
          ):
              value = scores.get(key)

              if (
                  isinstance(value, bool)
                  or not isinstance(value, (int, float))
                  or not math.isfinite(float(value))
              ):
                  raise SystemExit(
                      f"MU validation failed: invalid score {key}={value!r}."
                  )

          print(
              "MU signal validated successfully: "
              f"price=${float(price):,.2f}, "
              f"overall score={scores['overall']}"
          )
          PY

      - name: Move Micron report to dedicated page
        run: |
          mkdir -p docs/micron
          cp docs/index.html docs/micron/index.html

      - name: Generate main dashboard and stock detail pages
        run: |
          python dashboard.py

      - name: Validate generated dashboard artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("docs/index.html"),
              Path("docs/micron/index.html"),
              Path("docs/stocks/mu/index.html"),
          ]

          missing = [
              str(path)
              for path in required
              if not path.is_file()
          ]

          if missing:
              raise SystemExit(
                  "Dashboard validation failed; missing: "
                  + ", ".join(missing)
              )

          main_page = Path("docs/index.html").read_text(
              encoding="utf-8"
          )

          if "Micron Technology" not in main_page:
              raise SystemExit(
                  "Dashboard validation failed: Micron is absent "
                  "from the generated main dashboard."
              )

          print(
              "Dashboard artifacts validated successfully, including MU."
          )
          PY

      - name: Commit updated dashboards and signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git diff --staged --quiet || git commit -m "Update stock intelligence dashboards"

          git push
